[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-sync"
version = "0.1.0"
description = "DiffSync reconciliation for remote resources"
requires-python = ">=3.11"
dependencies = ["diffsync>=2,<3", "requests>=2,<3", "structlog"]

[project.scripts]
remote-sync = "remote_sync.cli:main"

[tool.setuptools.packages.find]
include = ["remote_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
