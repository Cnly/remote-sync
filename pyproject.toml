[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-sync"
version = "0.1.0"
description = "DiffSync reconciliation for remote resources"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.10.19",
    "diffsync>=2,<3",
    "requests>=2,<3",
    "structlog",
    "urllib3>=2.8,<3",
]

[project.scripts]
remote-sync = "remote_sync.cli:main"

[tool.setuptools.packages.find]
include = ["remote_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
